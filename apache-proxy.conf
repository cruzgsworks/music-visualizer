# Music Visualizer Generator - Apache Configuration
# Add this inside your VirtualHost directive

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    
    # WebSocket support - must come BEFORE regular ProxyPass
    # This handles WebSocket upgrade requests
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/music-visualizer/(.*) ws://127.0.0.1:3000/$1 [P,L]
    
    # Regular HTTP proxy
    ProxyPass /music-visualizer http://127.0.0.1:3000
    ProxyPassReverse /music-visualizer http://127.0.0.1:3000
    
    # Increase timeouts for video generation (can take several minutes)
    ProxyTimeout 600
    ProxyBadHeader Ignore
</IfModule>
